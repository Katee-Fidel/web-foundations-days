<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">A LITTLE SPACE FOR YOUR IDEAS</p><h1>QuickNotes.</h1><p>Capture a thought. Make room for the next one.</p></header>
    <section class="panel" aria-labelledby="create-heading">
      <h2 id="create-heading">Write a note</h2>
      <form id="note-form">
        <label for="title-input">Title (required, up to 100 characters)</label>
        <input id="title-input" name="title" required maxlength="100">
        <label for="body-input">Your note (optional)</label>
        <textarea id="body-input" name="body" rows="4"></textarea>
        <button id="submit-btn" type="submit" disabled>Save note</button>
      </form>
    </section>
    <section aria-labelledby="notes-heading">
      <div class="section-heading"><h2 id="notes-heading">Your collection</h2><button id="load-btn" type="button">Load notes</button></div>
      <p id="status" role="status" aria-live="polite">Load notes to get started.</p>
      <ul id="notes-list"></ul>
    </section>
    <footer>Practice API · Changes last for this browser session only.</footer>
  </main>
</body>
</html>
